model: Moment
task: forecasting
target_datasets: [ETTh1, ETTh2, ETTm1, ETTm2, Weather]
context_length: 96
horizons: [96, 192, 336, 720]
hyperparameters: {freeze_encoder: true, freeze_embedder: true}
optimization: {epochs: 10, learning_rate: 0.0001, batch_size: 32, patience: 3, samples_per_epoch: 100000, validation_samples: 20000}
windows: {evaluation_batch_size: 128}
stream: {coreset: random, coreset_fraction: 0.05, num_periods: 100, calibration_period: 10, calibration_epochs: 1, learning_rate: 0.0001,
  batch_size: 64, stream_stride: 1}
