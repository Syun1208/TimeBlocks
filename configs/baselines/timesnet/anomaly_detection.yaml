model: TimesNet
task: anomaly_detection
target_datasets: [SMD, MSL, SMAP, SWaT]
context_length: 96
anomaly: {threshold: validation_f1, point_adjustment: true}
hyperparameters: {d_model: 8, d_ff: 16, e_layers: 1, top_k: 3}
optimization: {epochs: 1, learning_rate: 0.0001, batch_size: 128, patience: 3, samples_per_epoch: 100000, validation_samples: 20000}
