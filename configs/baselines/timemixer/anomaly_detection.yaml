model: TimeMixer
task: anomaly_detection
target_datasets: [SMD, MSL, SMAP, SWaT]
context_length: 96
anomaly: {threshold: validation_f1, point_adjustment: true}
hyperparameters: {e_layers: 2, down_sampling_layers: 3, down_sampling_window: 2, down_sampling_method: avg, d_model: 16, d_ff: 32}
optimization: {epochs: 10, learning_rate: 0.0001, batch_size: 128, patience: 3, samples_per_epoch: 100000, validation_samples: 20000}
