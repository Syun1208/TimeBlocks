model: PatchTST
task: imputation
target_datasets: [ETTh1, ETTh2, ETTm1, ETTm2, Weather]
context_length: 96
imputation:
  mask_ratios: [0.1, 0.2, 0.3]
hyperparameters: {e_layers: 1, n_heads: 2, factor: 3}
optimization: {epochs: 10, learning_rate: 0.001, batch_size: 16, patience: 3, samples_per_epoch: 100000, validation_samples: 20000}
